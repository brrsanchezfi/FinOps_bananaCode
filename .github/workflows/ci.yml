name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Las pruebas marcadas `spark` levantan Spark + Delta local con el
      # Launcher de DKOps (tests/conftest.py). Spark 3.5 necesita Java 17.
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spark]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Formato (ruff format --check)
        run: ruff format --check src tests scripts
        continue-on-error: true

      - name: Pruebas unitarias
        run: python -m pytest --cov=finops --cov-report=term-missing --cov-report=xml

      - name: Publicar cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  configuracion:
    name: Validar configuracion y dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Una sola instalacion por cuenta (docs/adr/0006): ya no hay tres
      # entornos que validar por separado.
      - name: Validar la configuracion del producto
        run: |
          python -m finops.cli validate
          python -m finops.cli plan > /dev/null

      - name: Verificar que los dashboards versionados esten al dia
        run: python scripts/dashboards.py check

  bundle:
    name: Validar Databricks Asset Bundle
    runs-on: ubuntu-latest
    # Requiere los secretos de workspace. Se omite en forks / PRs externos.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - uses: databricks/setup-cli@main

      - name: Validar bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          # Sin valor por defecto en databricks.yml a proposito (es del
          # workspace del cliente), asi que CI tiene que aportarlo.
          BUNDLE_VAR_warehouse_id: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "::notice::Secretos de Databricks no configurados; se omite la validacion del bundle."
            exit 0
          fi
          # resources/dashboards.yml apunta a build/dashboards/, que produce
          # `render` y no se versiona. Sin este paso el bundle no encuentra los
          # tableros.
          python scripts/dashboards.py render
          databricks bundle validate -t finops
