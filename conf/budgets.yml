# ---------------------------------------------------------------------------
# Reglas de chargeback / showback.
# ---------------------------------------------------------------------------
chargeback:
  # Dimension primaria de imputacion.
  allocation_dimension: cost_center
  # Como se reparte el costo que no se pudo atribuir (SIN_ASIGNAR) y el costo
  # compartido (plataforma, gobierno, monitoreo).
  #   proportional : proporcional al costo directo de cada unidad
  #   even         : partes iguales
  #   none         : se deja en una unidad "SIN_ASIGNAR"
  unallocated_strategy: proportional
  shared_cost_strategy: proportional
  # Entidades cuyo costo se considera compartido (comodines admitidos).
  shared_entity_patterns:
    - "*finops*"
    - "*platform*"
    - "*plataforma*"
    - "*governance*"
  # Recargo administrativo aplicado al chargeback (0.05 = 5%).
  overhead_pct: 0.0
