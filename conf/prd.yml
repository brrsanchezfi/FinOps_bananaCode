# Overlay de entorno PRD.
catalog:
  catalog: finops

ingestion:
  lookback_days: 7
  initial_load_days: 400

pricing:
  # Ajustar con el descuento negociado real antes de usar en produccion.
  discounts:
    - name: default
      match: {}
      discount_pct: 0.0

alerting:
  enabled: true
  min_severity: medium
  channels:
    - name: tabla
      type: table
      enabled: true
      min_severity: low
    - name: teams
      type: webhook
      enabled: false          # activar tras cargar el secreto en el scope 'finops'
      secret_scope: finops
      secret_key: teams_webhook_url
      format: teams
      min_severity: high

quality:
  fail_pipeline_on_error: true

runtime:
  log_level: INFO
  gold_retention_days: 1100
