# =============================================================================
# Databricks Asset Bundle — Plataforma de analitica FinOps
#
# El WORKSPACE DESTINO no esta escrito aqui: sale del perfil del CLI o de
# DATABRICKS_HOST. Este repositorio es producto y se despliega sobre la cuenta
# de cada cliente; un host quemado se heredaria en instalaciones ajenas.
#
#   databricks auth login --host https://adb-XXXX.N.azuredatabricks.net -p finops
#
# Despliegue:
#   databricks bundle validate -t dev -p finops
#   databricks bundle deploy   -t dev -p finops
#   databricks bundle run finops_pipeline_diario -t dev -p finops
#
# O bien, con el script que encadena los pasos:
#   pwsh scripts/deploy.ps1 -Env dev -Profile finops
#   bash scripts/deploy.sh dev --profile finops
#
# El `warehouse_id` que alimenta los dashboards tampoco tiene valor por defecto.
# Se pasa con --var o con la variable de entorno equivalente:
#   databricks warehouses list -p finops
#   export BUNDLE_VAR_warehouse_id=<id>
# =============================================================================

bundle:
  name: finops-bananacode

include:
  - resources/*.yml

# El wheel se instala en los clusters de job. Los notebooks tambien funcionan sin
# el (agregan `src/` al sys.path), pero el wheel es el camino soportado.
#
# Se usa `pip wheel` y no `python -m build` a proposito: `build` es un paquete
# aparte que hay que instalar, y el CLI puede ejecutarse desde entornos donde no
# esta (un cluster de Databricks, un runner de CI minimo, una maquina limpia).
# `pip` siempre esta, asi que el deploy no depende de un prerrequisito oculto.
artifacts:
  finops_wheel:
    type: whl
    build: python -m pip wheel . --no-deps --wheel-dir dist
    path: .

sync:
  # El CLI excluye del bundle todo lo que git ignora, y la configuracion de la
  # instalacion (conf/local.yml) esta ignorada a proposito. Sin estas dos lineas
  # el pipeline corre EN EL WORKSPACE con la configuracion neutra del
  # repositorio: sin workspaces mapeados, sin presupuestos y con todo el costo
  # cayendo en SIN_ASIGNAR, sin ningun error visible.
  include:
    - conf/local.yml
    - conf/budgets.local.yml

  exclude:
    - .git/**
    - .venv/**
    - .pytest_cache/**
    - .ruff_cache/**
    - __pycache__/**
    - dist/**
    - build/**
    - tests/**
    - "*.egg-info/**"

variables:
  catalog:
    description: Catalogo de Unity Catalog donde vive el modelo FinOps.
    default: finops

  warehouse_id:
    description: >-
      ID del SQL warehouse que alimenta los dashboards. Obtenerlo con
      `databricks warehouses list -p <perfil>`. Es obligatorio para desplegar
      los dashboards. SIN VALOR POR DEFECTO a proposito: el warehouse pertenece
      al workspace del cliente, y un default apuntando a otro haria fallar el
      deploy con un error opaco en vez de pedir el dato. Pasarlo con
      `--var="warehouse_id=..."` o `BUNDLE_VAR_warehouse_id`.

  node_type_id:
    description: >-
      Tipo de nodo del cluster de job (Azure). El pipeline es liviano y no pide
      hardware concreto, asi que este valor es solo "algo que exista y tenga
      capacidad en la region del workspace".

      Si el cluster muere con CLOUD_PROVIDER_RESOURCE_STOCKOUT / SkuNotAvailable
      -- que la tarea reporta como INTERNAL_ERROR, sin parecerse a la causa --
      la SKU esta agotada en esa region: cambiala por otra familia. Pools
      distintos: D4ads_v5 (AMD), D4ds_v5 (Intel), DS3_v2 (v2, la mas disponible).

          databricks clusters list-node-types -p <perfil>
          databricks bundle deploy -t dev -p <perfil> --var="node_type_id=Standard_DS3_v2"
    default: Standard_D4ads_v5

  spark_version:
    description: Version de Databricks Runtime (LTS recomendado).
    default: 15.4.x-scala2.12

  num_workers:
    description: Workers del cluster de job. El pipeline es liviano; 1-2 basta.
    default: 1

  notification_email:
    description: >-
      Correo que recibe las notificaciones de fallo de los jobs. Ajustar por
      instalacion con `--var` o `BUNDLE_VAR_notification_email`.
    default: finops@example.com

  cron_pipeline:
    description: >-
      Cron (formato Quartz) del pipeline diario. Por defecto 07:00 hora Bogota,
      con margen suficiente sobre la latencia de publicacion de system.billing.usage.
    default: "0 0 7 * * ?"

  cron_alertas:
    description: Cron del job de alertamiento (mas frecuente que el pipeline).
    default: "0 0 7,13,19 * * ?"

  timezone:
    description: Zona horaria de los schedules.
    default: America/Bogota

  pipeline_paused:
    description: PAUSED para desplegar sin activar el schedule, UNPAUSED para activarlo.
    default: PAUSED

targets:
  # ---------------------------------------------------------------------------
  dev:
    mode: development     # prefija los recursos con el usuario y pausa schedules
    default: true
    workspace:
      # Sin `host`: lo aporta el perfil del CLI (-p) o DATABRICKS_HOST. Ver el
      # encabezado de este archivo.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: finops
      num_workers: 1
      pipeline_paused: PAUSED

# ---------------------------------------------------------------------------
# Un unico target de despliegue: dev.
#
# El modelo FinOps describe el consumo de la CUENTA, no de un ambiente: lee
# `system.billing.usage`, que cubre todos los workspaces de la cuenta. El
# pipeline corriendo en un solo workspace mide igual el gasto de los demas, asi
# que no hace falta una copia desplegada por ambiente. Ver docs/adr/0005.
#
# Los targets `qa` y `prd` se retiraron: desplegaban sobre workspaces de la
# misma cuenta y solo duplicaban jobs y tableros sobre los mismos datos. Si una
# instalacion necesita aislar el despliegue, agregar el target aqui con su
# propio `root_path` y desplegarlo con el perfil de ese workspace.
#
# `conf/qa.yml` y `conf/prd.yml` se conservan a proposito: son overlays de
# CONFIGURACION, un eje distinto del despliegue. `scripts/dashboards.py` los usa
# para verificar que los tres entornos generen tableros identicos, y varios
# tests los parametrizan.
# ---------------------------------------------------------------------------
