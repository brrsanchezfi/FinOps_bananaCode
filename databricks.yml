# =============================================================================
# Databricks Asset Bundle — Plataforma de analitica FinOps
#
# El WORKSPACE DESTINO no esta escrito aqui: sale del perfil del CLI o de
# DATABRICKS_HOST. Este repositorio es producto y se despliega sobre la cuenta
# de cada cliente; un host quemado se heredaria en instalaciones ajenas.
#
#   databricks auth login --host https://adb-XXXX.N.azuredatabricks.net -p finops
#
# Despliegue:
#   databricks bundle validate -t finops -p finops
#   databricks bundle deploy   -t finops -p finops
#   databricks bundle run finops_pipeline_diario -t finops -p finops
#
# O bien, con el script que encadena los pasos:
#   pwsh scripts/deploy.ps1 -Env dev -Profile finops
#   bash scripts/deploy.sh dev --profile finops
#
# El `warehouse_id` que alimenta los dashboards tampoco tiene valor por defecto.
# Se pasa con --var o con la variable de entorno equivalente:
#   databricks warehouses list -p finops
#   export BUNDLE_VAR_warehouse_id=<id>
# =============================================================================

bundle:
  name: finops-bananacode

include:
  - resources/*.yml

# El wheel se instala en los clusters de job. Los notebooks tambien funcionan sin
# el (agregan `src/` al sys.path), pero el wheel es el camino soportado.
#
# Se usa `pip wheel` y no `python -m build` a proposito: `build` es un paquete
# aparte que hay que instalar, y el CLI puede ejecutarse desde entornos donde no
# esta (un cluster de Databricks, un runner de CI minimo, una maquina limpia).
# `pip` siempre esta, asi que el deploy no depende de un prerrequisito oculto.
artifacts:
  finops_wheel:
    type: whl
    build: python -m pip wheel . --no-deps --wheel-dir dist
    path: .

sync:
  # El CLI excluye del bundle todo lo que git ignora, y la configuracion de la
  # instalacion (conf/local.yml) esta ignorada a proposito. Sin estas dos lineas
  # el pipeline corre EN EL WORKSPACE con la configuracion neutra del
  # repositorio: sin workspaces mapeados, sin presupuestos y con todo el costo
  # cayendo en SIN_ASIGNAR, sin ningun error visible.
  include:
    - conf/local.yml
    - conf/budgets.local.yml
    # Los tableros resueltos para esta instalacion (ver resources/dashboards.yml).
    # `build/` esta en .gitignore, asi que sin esta linea el deploy falla con
    # "no such file or directory" sobre el primer dashboard.
    - build/dashboards/*.lvdash.json

  exclude:
    - .git/**
    - .venv/**
    - .pytest_cache/**
    - .ruff_cache/**
    - __pycache__/**
    - dist/**
    # `build/**` NO se excluye aqui: git ya lo ignora, y excluirlo ademas
    # tapaba el `include` de build/dashboards/ de arriba.
    - tests/**
    - "*.egg-info/**"

variables:
  catalog:
    description: Catalogo de Unity Catalog donde vive el modelo FinOps.
    default: finops

  warehouse_id:
    description: >-
      ID del SQL warehouse que alimenta los dashboards. Obtenerlo con
      `databricks warehouses list -p <perfil>`. Es obligatorio para desplegar
      los dashboards. SIN VALOR POR DEFECTO a proposito: el warehouse pertenece
      al workspace del cliente, y un default apuntando a otro haria fallar el
      deploy con un error opaco en vez de pedir el dato. Pasarlo con
      `--var="warehouse_id=..."` o `BUNDLE_VAR_warehouse_id`.

  node_type_id:
    description: >-
      Tipo de nodo del cluster de job (Azure). El pipeline es liviano y no pide
      hardware concreto, asi que este valor es solo "algo que exista y tenga
      capacidad en la region del workspace".

      Si el cluster muere con CLOUD_PROVIDER_RESOURCE_STOCKOUT / SkuNotAvailable
      -- que la tarea reporta como INTERNAL_ERROR, sin parecerse a la causa --
      la SKU esta agotada en esa region: cambiala por otra familia, no por otro
      tamano de la misma. Pools distintos: D2ads_v6 (AMD v6), D4ds_v5 (Intel v5),
      DS3_v2 (v2, la generacion mas vieja y la mas disponible).

          databricks clusters list-node-types -p <perfil>
          databricks bundle deploy -t finops -p <perfil> --var="node_type_id=Standard_DS3_v2"
    default: Standard_D2ads_v6

  spark_version:
    description: Version de Databricks Runtime (LTS recomendado).
    default: 16.4.x-scala2.12

  num_workers:
    description: >-
      Workers del cluster del pipeline diario. 0 = NODO UNICO, que es el valor
      por defecto: el pipeline lee una ventana corta de las system tables y
      escribe agregados, asi que no hay reparto que justifique workers. Ademas
      pedir UNA VM en vez de varias reduce la probabilidad de chocar con las
      restricciones de capacidad de la region.

      Si se sube, hay que quitar tambien `spark.master`,
      `spark.databricks.cluster.profile` y el tag `ResourceClass` del cluster en
      resources/jobs.yml: un cluster declarado singleNode con workers no arranca.
    default: 0

  notification_email:
    description: >-
      Correo que recibe las notificaciones de fallo de los jobs. Ajustar por
      instalacion con `--var` o `BUNDLE_VAR_notification_email`.
    default: finops@example.com

  cron_pipeline:
    description: >-
      Cron (formato Quartz) del pipeline diario. Por defecto 07:00 hora Bogota,
      con margen suficiente sobre la latencia de publicacion de system.billing.usage.
    default: "0 0 7 * * ?"

  cron_alertas:
    description: Cron del job de alertamiento (mas frecuente que el pipeline).
    default: "0 0 7,13,19 * * ?"

  timezone:
    description: Zona horaria de los schedules.
    default: America/Bogota

  pipeline_paused:
    description: PAUSED para desplegar sin activar el schedule, UNPAUSED para activarlo.
    default: PAUSED

  resource_environment:
    description: >-
      Ambiente con el que se ETIQUETA el propio computo de FinOps (jobs y
      clusters), para que su costo se clasifique como cualquier otro recurso
      del cliente. Es la dimension `environment` del modelo -- DEV, QA o PRD --
      y NO tiene nada que ver con el nombre del target: ese nombra la
      instalacion de FinOps, este dice en que ambiente vive su computo.

      Estuvieron atados al target y eso era un error latente: al renombrarlo,
      el costo del pipeline habria aparecido en un ambiente inexistente con el
      nombre del target. Va en su forma canonica para no depender de
      `tagging.value_map`.

      PRD por defecto: instalado en un cliente, FinOps es una carga productiva.
      En un banco de pruebas: BUNDLE_VAR_resource_environment=DEV.
    default: PRD

targets:
  # ---------------------------------------------------------------------------
  # UNA instalacion, que cubre todos los ambientes de la cuenta. Ver el bloque
  # de abajo y docs/adr/0006.
  finops:
    mode: development     # prefija los recursos con el usuario y pausa schedules
    default: true
    workspace:
      # Sin `host`: lo aporta el perfil del CLI (-p) o DATABRICKS_HOST. Ver el
      # encabezado de este archivo.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: finops
      num_workers: 0
      pipeline_paused: PAUSED

# ---------------------------------------------------------------------------
# Un unico target: `finops`.
#
# El tablero se vende como producto terminado y describe el consumo de la
# CUENTA: lee `system.billing.usage`, que cubre todos los workspaces y todos los
# ambientes del cliente. Una sola instalacion ya muestra dev, qa y prd; tres
# instalaciones producirian las mismas cifras tres veces. Ver docs/adr/0006.
#
# Hasta el 27 sep 2026 se llamaba `dev`, y habia overlays conf/dev.yml, qa.yml y
# prd.yml. Se colapsaron en conf/base.yml (el perfil estricto de prd) mas
# conf/local.yml (lo propio de cada instalacion).
#
# NO confundir dos cosas que comparten la palabra "ambiente":
#   - el TARGET nombra la instalacion de FinOps. Hay una.
#   - `resource_environment` y la dimension `environment` clasifican los
#     recursos del cliente en DEV / QA / PRD. Eso es un dato que el tablero
#     MIDE, y sigue existiendo intacto.
# ---------------------------------------------------------------------------
