# =============================================================================
# Dashboards Lakeview.
#
# Los archivos apuntan a `build/dashboards/`, que NO se versiona: son los
# tableros resueltos contra el catalogo de ESTA instalacion. Se producen con
#
#     python scripts/dashboards.py render --env <entorno>
#
# que `scripts/deploy.*` ejecuta antes de desplegar. Si corres
# `databricks bundle deploy` a mano, corre `render` primero o el deploy fallara
# con "no such file or directory".
#
# Por que no apuntar directo a `dashboards/`: esos JSON estan resueltos contra
# la configuracion NEUTRA del repositorio y nombran el catalogo `finops`. Una
# instalacion con otro catalogo desplegaria tableros apuntando a un
# catalogo ajeno, que no fallan: salen VACIOS.
#
# Hay una sola instalacion (docs/adr/0006), asi que basta un juego de archivos.
# Los nombres de tabla salen de la configuracion, nunca escritos a mano.
#
# `warehouse_id` es obligatorio y no tiene valor por defecto: es del workspace
# del cliente. Pasarlo con BUNDLE_VAR_warehouse_id o
#     databricks bundle deploy -t finops --var="warehouse_id=abc123"
# =============================================================================

resources:
  dashboards:
    # Un solo tablero: la Vista ejecutiva lleva como pestanas Costos y
    # chargeback, Optimizacion y gobierno, y Gobierno de etiquetado (las arma
    # `render`, ver TABLERO_UNIFICADO en scripts/dashboards.py).
    #
    # La pestana de etiquetado es la unica que NO depende de la ejecucion del
    # pipeline: consulta las vistas `vw_*_live`, que leen system.billing.usage
    # directamente. Para que la vea alguien sin permiso sobre `system.billing`,
    # publicar el tablero con credenciales embebidas.
    finops_ejecutivo:
      display_name: "[FinOps] Vista ejecutiva"
      file_path: ../build/dashboards/finops_ejecutivo.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${workspace.root_path}/dashboards
