# =============================================================================
# Dashboards Lakeview.
#
# Los archivos apuntan a `build/dashboards/`, que NO se versiona: son los
# tableros resueltos contra el catalogo de ESTA instalacion. Se producen con
#
#     python scripts/dashboards.py render --env <entorno>
#
# que `scripts/deploy.*` ejecuta antes de desplegar. Si corres
# `databricks bundle deploy` a mano, corre `render` primero o el deploy fallara
# con "no such file or directory".
#
# Por que no apuntar directo a `dashboards/`: esos JSON estan resueltos contra
# la configuracion NEUTRA del repositorio y nombran el catalogo `finops`. Una
# instalacion con otro catalogo desplegaria cuatro tableros apuntando a un
# catalogo ajeno, que no fallan: salen VACIOS.
#
# Un solo juego de archivos sirve para los tres entornos porque comparten
# catalogo y schemas. Los nombres de tabla salen de la configuracion, nunca
# escritos a mano.
#
# `warehouse_id` es obligatorio: definirlo en el bloque `variables` del target
# correspondiente en databricks.yml, o pasarlo con
#     databricks bundle deploy -t prd --var="warehouse_id=abc123"
# =============================================================================

resources:
  dashboards:
    finops_ejecutivo:
      display_name: "[FinOps] Vista ejecutiva (${bundle.target})"
      file_path: ../build/dashboards/finops_ejecutivo.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${workspace.root_path}/dashboards

    finops_costos:
      display_name: "[FinOps] Costos y chargeback (${bundle.target})"
      file_path: ../build/dashboards/finops_costos.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${workspace.root_path}/dashboards

    finops_optimizacion:
      display_name: "[FinOps] Optimizacion y gobierno (${bundle.target})"
      file_path: ../build/dashboards/finops_optimizacion.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${workspace.root_path}/dashboards

    # Unico tablero que NO depende de la ejecucion del pipeline: consulta las
    # vistas `vw_*_live`, que leen system.billing.usage directamente. Para que
    # lo vea alguien sin permiso sobre `system.billing`, publicarlo con
    # credenciales embebidas.
    finops_etiquetado:
      display_name: "[FinOps] Gobierno de etiquetado (${bundle.target})"
      file_path: ../build/dashboards/finops_etiquetado.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${workspace.root_path}/dashboards
