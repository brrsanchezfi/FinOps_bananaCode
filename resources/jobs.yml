# =============================================================================
# Jobs de la plataforma FinOps.
#
#   finops_pipeline_diario  ingesta + modelo + analitica + calidad + alertas
#   finops_alertas          solo alertamiento, con mayor frecuencia
#   finops_backfill         recarga historica manual (full refresh)
#
# Cada job es una sola tarea con el notebook `10_etapa` (o el orquestador) y
# su lista de etapas en el parametro `stages`. El detalle por etapa (duracion,
# filas, estado) queda en el log de la corrida y en `ops_run_log`.
# =============================================================================

resources:
  jobs:
    # -------------------------------------------------------------------------
    finops_pipeline_diario:
      name: "[FinOps] Pipeline diario"
      description: >-
        Ingesta las system tables de facturacion, construye el modelo FinOps
        (bronze/silver/gold), ejecuta la analitica (anomalias, pronostico,
        presupuestos, recomendaciones, chargeback), valida la calidad de los
        datos y despacha las alertas.
      tags:
        proyecto: finops
        entorno: ${var.resource_environment}
        gestionado_por: databricks-asset-bundle

      schedule:
        quartz_cron_expression: ${var.cron_pipeline}
        timezone_id: ${var.timezone}
        pause_status: ${var.pipeline_paused}

      # Una sola corrida a la vez: las escrituras son idempotentes por rango de
      # fechas, pero dos corridas simultaneas sobre el mismo rango compiten.
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${var.notification_email}
        on_duration_warning_threshold_exceeded:
          - ${var.notification_email}

      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 5400          # 90 minutos

      job_clusters:
        - job_cluster_key: finops_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: ${var.num_workers}
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON
            spark_conf:
              spark.sql.adaptive.enabled: "true"
              spark.databricks.delta.schema.autoMerge.enabled: "true"
              # Nodo unico (var.num_workers vale 0 por defecto). El pipeline
              # diario lee una ventana corta de las system tables y escribe
              # agregados: no hay reparto que justifique workers, y pedir UNA VM
              # en vez de varias reduce la probabilidad de chocar con la
              # capacidad de la region.
              #
              # Si se sube `num_workers`, hay que quitar estas dos claves y el
              # tag ResourceClass de abajo: un cluster declarado singleNode con
              # workers no arranca.
              spark.master: "local[*]"
              spark.databricks.cluster.profile: singleNode
            azure_attributes:
              availability: ON_DEMAND_AZURE
              first_on_demand: 1
            custom_tags:
              ResourceClass: SingleNode
              proyecto: finops
              cost_center: PLATAFORMA
              team: FINOPS
              environment: ${var.resource_environment}

      parameters:
        - name: env
          default: ${bundle.target}
        - name: run_date
          default: ""
        - name: full_refresh
          default: "false"
        - name: dry_run
          default: "false"
        - name: overrides
          default: ""
        # Todas las etapas por defecto; se puede pedir un subconjunto al lanzar
        # la corrida (`--params stages=silver,gold`).
        - name: stages
          default: "setup,bronze,silver,gold,analytics,quality,alerts,maintenance"

      # Una sola tarea que corre todas las etapas de corrido, en el mismo proceso
      # y con un solo archivo de log; cada etapa abre con un separador en el log.
      # Si falla setup, bronze, silver o gold la corrida se corta; si falla
      # analitica o calidad, alertas y mantenimiento corren igual y la tarea
      # termina en error al final (ver `pipeline.BLOCKING_STAGES`).
      tasks:
        - task_key: pipeline
          description: Ingesta, modelo, analitica, calidad, alertas y mantenimiento.
          job_cluster_key: finops_cluster
          notebook_task:
            notebook_path: ../notebooks/10_etapa.py
          libraries:
            - whl: ../dist/*.whl
          timeout_seconds: 10800     # 3 horas
          # Reintentar repite la corrida completa; las escrituras son idempotentes.
          max_retries: 1
          min_retry_interval_millis: 120000

    # -------------------------------------------------------------------------
    finops_alertas:
      name: "[FinOps] Alertamiento"
      description: >-
        Reevalua las reglas de alerta sobre el modelo gold ya construido. Corre
        con mayor frecuencia que el pipeline para acortar el tiempo de deteccion
        de un desbordamiento de presupuesto. La deduplicacion por huella evita
        repetir notificaciones dentro del periodo de enfriamiento.
      tags:
        proyecto: finops
        entorno: ${var.resource_environment}

      schedule:
        quartz_cron_expression: ${var.cron_alertas}
        timezone_id: ${var.timezone}
        pause_status: ${var.pipeline_paused}

      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${var.notification_email}

      job_clusters:
        - job_cluster_key: finops_cluster_alertas
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              # Single node: el alertamiento solo lee agregados de gold.
              spark.master: "local[*]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode
              proyecto: finops
              cost_center: PLATAFORMA
              team: FINOPS
              environment: ${var.resource_environment}

      tasks:
        - task_key: alertas
          job_cluster_key: finops_cluster_alertas
          notebook_task:
            notebook_path: ../notebooks/10_etapa.py
            base_parameters:
              env: ${bundle.target}
              stages: "alerts"
          libraries:
            - whl: ../dist/*.whl
          timeout_seconds: 1800
          max_retries: 1

    # -------------------------------------------------------------------------
    finops_backfill:
      name: "[FinOps] Backfill historico"
      description: >-
        Recarga completa del historico disponible en las system tables. Se
        ejecuta manualmente: no tiene schedule. Usa `ingestion.initial_load_days`
        del entorno para determinar cuanto historico traer.
      tags:
        proyecto: finops
        entorno: ${var.resource_environment}
        tipo: manual

      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${var.notification_email}
        on_success:
          - ${var.notification_email}

      job_clusters:
        - job_cluster_key: finops_cluster_backfill
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            # El backfill procesa cientos de dias: conviene mas capacidad.
            autoscale:
              min_workers: 2
              max_workers: 8
            data_security_mode: SINGLE_USER
            runtime_engine: PHOTON
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
              first_on_demand: 1
              spot_bid_max_price: -1
            custom_tags:
              proyecto: finops
              cost_center: PLATAFORMA
              team: FINOPS
              environment: ${var.resource_environment}

      parameters:
        - name: env
          default: ${bundle.target}
        - name: run_date
          default: ""
        - name: overrides
          default: ""

      tasks:
        - task_key: backfill_completo
          job_cluster_key: finops_cluster_backfill
          notebook_task:
            notebook_path: ../notebooks/00_orquestador.py
            base_parameters:
              full_refresh: "true"
              stages: "setup,bronze,silver,gold,analytics,quality,maintenance"
          libraries:
            - whl: ../dist/*.whl
          timeout_seconds: 21600     # 6 horas
